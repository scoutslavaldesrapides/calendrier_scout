name: Update Calendrier Scout

on:
  schedule:
    - cron: "0 3 * * *"   # runs every hour
  workflow_dispatch:       # allows manual run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pyyaml pytz

      - name: Generate ICS files
        run: |
          python generate.py

      - name: Commit updated ICS files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add calendriers/parents_aventurier.ics calendriers/animateurs_aventurier.ics
          git commit -m "Update" || echo "No changes to commit"
          git push
